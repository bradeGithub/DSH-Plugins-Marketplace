name: build-registry

on:
  schedule:
    # 每 2 小时增量更新一次索引（UTC；即北京时间每偶数点整）
    - cron: "0 */2 * * *"
    # 每天 04:00 UTC（北京时间 12:00）全量重建两个索引，刷新 star 数等静态数据
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "全量重建两个索引（默认增量）"
        type: boolean
        default: false

permissions:
  contents: write

# 同一时间只允许一个构建运行，避免定时任务与手动触发互相重叠
concurrency:
  group: build-registry
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Syntax check
        run: |
          node --check scripts/build-registry.mjs
          node --check lib/index.js
          node --check lib/client.js
          node scripts/smoke-tests.mjs
          node scripts/tests/run.mjs --level=unit,integration

      - name: Build DSH registry (full)
        # 每天 04:00 UTC（北京时间 12:00）或手动勾选 full：全量重建，刷新 star 数等静态数据
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.full == 'true' || github.event.schedule == '0 4 * * *' }}
        run: node scripts/build-registry.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build DSH registry (incremental)
        # 其余每 2 小时：增量模式，只拉最近 3 天 pushed 的仓库并与旧索引合并（几分钟完成）
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.full == 'true' || github.event.schedule == '0 4 * * *') }}
        run: INCREMENTAL_DAYS=3 node scripts/build-registry.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # skills 索引：增量（每 2 小时，只拉最近 3 天 pushed 的仓库，几分钟完成）
      # 或全量（每天 04:00 / 手动勾选 full），刷新全量 star 数
      - name: Build skills registry (full)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.full == 'true' || github.event.schedule == '0 4 * * *' }}
        run: SOURCES_MODE=skills node scripts/build-registry.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build skills registry (incremental)
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.full == 'true' || github.event.schedule == '0 4 * * *') }}
        run: SOURCES_MODE=skills INCREMENTAL_DAYS=3 node scripts/build-registry.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 可安装性探测（增量续跑）：对新收录/未判定条目两阶段探测（trees → package.json 内容），
      # 产 installability-report.json（non-plugin/manual 徽章数据源）。基线 = 仓库已提交报告，
      # 每轮只补未判定/pending 条目；RATE_FLOOR 护栏防超 Core 额度（5000/h），多轮收敛。
      - name: Probe installability (incremental)
        run: node scripts/verify-installability.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit registry.json
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry.json registry.json.gz skills.json skills.json.gz installability-report.json
          # drift-report.json 是「有漂移才存在」的产物：build-registry.mjs 在 0 漂移时**故意删除**它
          # （见该脚本的分类漂移段：driftItems 为空 → await rm(reportPath)），所以「删除」是合法状态。
          # 必须用 -A 把新增/修改/**删除**三种状态都入暂存：只 add 存在的文件（2026-09-10 的写法）
          # 会让删除残留在工作区（未暂存）→ 下面 git pull --rebase 被
          # 「error: cannot pull with rebase: You have unstaged changes」直接拒绝 → 三次重试全废。
          # 这才是 2026-09-12 那次「push 失败」的真因（诊断改造后由日志确证：`D drift-report.json`）。
          # 测试侧已改为容忍该文件缺失（见 test-runner-drift-isolation.test.mjs），故删除可安全提交。
          git add -A drift-report.json 2>/dev/null || true
          # 兜底：rebase 拒绝在脏工作区上运行——把跟踪文件的其余改动/删除（构建或探测写入的其它文件）
          # 也一并入暂存并提交，避免「产物之外的残留」再次把 rebase 卡死。
          git add -u
          if git diff --cached --quiet; then
            echo "索引无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: update registry.json"
          # 远端可能已被作者或其他提交推进：先 rebase 再推，最多重试 3 次。
          # -X ours：索引文件（registry.json/skills.json）冲突时保留 CI 刚构建的版本
          # （rebase 中 ours = 正在 replay 的 CI commit，theirs = 远端基线——
          # 注意与 merge 语义相反，勿改回 theirs，否则冲突时 CI 产物会被远端覆盖）。
          for i in 1 2 3; do
            # 诊断要求（2026-09-12 复盘）：**不得吞掉 git 输出**。这里原本是
            #   `git pull --rebase ... >/dev/null 2>&1 && git push ... >/dev/null 2>&1`
            # 于是失败只剩一句「推送被远端新提交拒绝」，而实测那两次远端根本没动过——
            # 真因（rebase 冲突 / push 超时 / 认证）完全不可考。故：捕获并打印输出，
            # 失败时附带 status/log 现场；重试前先 rebase --abort 清中间态
            #（否则第一次失败后仓库卡在 rebase 中，后两次必然一起失败）。
            git rebase --abort >/dev/null 2>&1 || true
            pull_log=""
            if pull_log=$(git pull --rebase -X ours origin main 2>&1); then
              push_log=""
              if push_log=$(git push origin main 2>&1); then
                echo "已提交更新"
                exit 0
              fi
              echo "第 $i 次：git push 失败，输出如下："
              printf '%s\n' "$push_log"
            else
              echo "第 $i 次：git pull --rebase 失败，输出如下："
              printf '%s\n' "$pull_log"
            fi
            echo "--- 工作区状态（前 10 行）---"
            git status --short 2>&1 | head -10 || true
            echo "--- 最近 3 个提交 ---"
            git log --oneline -3 2>&1 || true
            echo "--- 落后/领先远端（left=remote right=local）---"
            git rev-list --left-right --count origin/main...HEAD 2>&1 || true
            echo "10 秒后重试..."
            sleep 10
          done
          echo "推送失败：多次重试后仍被拒绝" >&2
          exit 1
