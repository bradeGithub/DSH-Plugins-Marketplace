name: build-registry

on:
  schedule:
    # 每 2 小时增量更新一次索引（UTC；即北京时间每偶数点整）
    - cron: "0 */2 * * *"
    # 每天 04:00 UTC（北京时间 12:00）全量重建 skills 索引，刷新 star 数等静态数据
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "全量重建 skills 索引（默认增量）"
        type: boolean
        default: false

permissions:
  contents: write

# 同一时间只允许一个构建运行，避免定时任务与手动触发互相重叠
concurrency:
  group: build-registry
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Syntax check
        run: |
          node --check scripts/build-registry.mjs
          node --check lib/index.js
          node --check lib/client.js
          node scripts/smoke-tests.mjs
          node scripts/guided-install-tests.mjs

      - name: Build DSH registry
        run: node scripts/build-registry.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # skills 索引：增量（每 2 小时，只拉最近 3 天 pushed 的仓库，几分钟完成）
      # 或全量（每天 04:00 / 手动勾选 full），刷新全量 star 数
      - name: Build skills registry (full)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.full == 'true' || github.event.schedule == '0 4 * * *' }}
        run: SOURCES_MODE=skills node scripts/build-registry.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build skills registry (incremental)
        if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.full == 'true' || github.event.schedule == '0 4 * * *') }}
        run: SOURCES_MODE=skills INCREMENTAL_DAYS=3 node scripts/build-registry.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit registry.json
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add registry.json skills.json
          if git diff --cached --quiet; then
            echo "索引无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: update registry.json"
          # 远端可能已被作者或其他提交推进：先 rebase 再推，最多重试 3 次。
          # -X theirs：索引文件（registry.json/skills.json）冲突时保留 CI 刚构建的版本
          # （CI 数据最新），否则 rebase 因 content 冲突失败、3 次重试全挂（job 失败）。
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main >/dev/null 2>&1 && git push origin main >/dev/null 2>&1; then
              echo "已提交更新"
              exit 0
            fi
            echo "推送被远端新提交拒绝（第 $i 次），10 秒后重试..."
            sleep 10
          done
          echo "推送失败：多次重试后仍被拒绝" >&2
          exit 1
