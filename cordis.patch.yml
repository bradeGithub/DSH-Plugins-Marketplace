# dsh-plugin-marketplace 的 bundle 补丁层（官方安装方式专用）
# 声明本插件如何挂载进目标 profile，供以下命令使用：
#   dsh plugin --profile <profile> add bradeGithub/DSH-Plugins-Marketplace
# 由 harness 的 dsh CLI 在安装时 reconcile 进 dsh.profile.bundles；
# 桌面端（DSH 0.2.0+）的 desktop profile 由 Electron 应用独占、CLI 拒绝操作它——
# 请在应用内的插件面板安装本插件（或由市场面板的安装流程接管）。
# 市场面板自带的安装流程（复制 + 注册到 profile patch）不受影响。
- insert:
    - id: plugin-marketplace
      name: dsh-plugin-marketplace
      inject: [webServer]
